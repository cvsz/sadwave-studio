name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Compile
        run: python -m compileall -q sadwave tests

      - name: Unit and API tests
        run: pytest

      - name: Dependency audit
        run: pip-audit

      - name: Repository validation
        run: make validate

      - name: Secret filename check
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|.*\.pem|.*\.key)$' | grep -v '^\.env\.example$'; then
            echo 'Potential secret-bearing file is tracked.'
            exit 1
          fi

      - name: YAML syntax
        shell: bash
        run: ruby -e 'require "yaml"; Dir.glob(".github/**/*.{yml,yaml}").each { |f| YAML.load_file(f); puts "ok #{f}" }'

  container:
    runs-on: ubuntu-latest
    needs: application
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: docker build --pull --tag sadwave-studio:ci .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: sadwave-studio:ci
          artifact-name: sbom.spdx.json
          output-format: spdx-json
