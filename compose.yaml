services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: sadwave
      POSTGRES_USER: sadwave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sadwave -d sadwave"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      APP_ENV: production
      APP_PORT: 3000
      DATABASE_URL: postgresql://sadwave:${POSTGRES_PASSWORD}@postgres:5432/sadwave
      API_TOKEN: ${API_TOKEN:?API_TOKEN is required}
      DRY_RUN: "true"
      AUTONOMY_LEVEL: "0"
      COST_LOCK: "true"
      AI_PROVIDER_MODE: local
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
