name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SADWAVE_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/sadwave_test
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: sadwave_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sadwave_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip==26.2.1

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Compile
        run: python -m compileall -q sadwave tests

      - name: Unit and API tests
        run: pytest

      - name: Dependency audit
        run: pip-audit

      - name: Repository validation
        run: make validate

      - name: Secret filename check
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|.*\.pem|.*\.key)$' | grep -v '^\.env\.example$'; then
            echo 'Potential secret-bearing file is tracked.'
            exit 1
          fi

      - name: YAML syntax
        run: |
          ruby <<'RUBY'
          require "yaml"
          Dir.glob(".github/**/*.{yml,yaml}").each do |file|
            YAML.load_file(file)
            puts "ok #{file}"
          end
          RUBY

  container:
    runs-on: ubuntu-latest
    needs: application
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --pull --tag sadwave-studio:ci .

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: sadwave-studio:ci
          artifact-name: sbom.spdx.json
          format: spdx-json
