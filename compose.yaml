services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: sadwave
      POSTGRES_USER: sadwave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sadwave -d sadwave"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    environment:
      APP_ENV: production
      APP_PORT: 3000
      DATABASE_URL: postgresql://sadwave_app@postgres:5432/sadwave
      PGPASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}
      API_TOKEN: ${API_TOKEN:?API_TOKEN is required}
      DRY_RUN: "true"
      AUTONOMY_LEVEL: "0"
      COST_LOCK: "true"
      AI_PROVIDER_MODE: local
      API_RATE_LIMIT: "60"
      API_RATE_WINDOW_SECONDS: "60"
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    command: ["python", "-m", "sadwave.worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://sadwave_app@postgres:5432/sadwave
      PGPASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}
      DRY_RUN: "true"
      AUTONOMY_LEVEL: "0"
      COST_LOCK: "true"
      AI_PROVIDER_MODE: local
      WORKER_ID: ${WORKER_ID:-sadwave-worker}
      WORKER_LEASE_SECONDS: "300"
      WORKER_POLL_SECONDS: "2"
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build: .
    command: ["python", "scripts/migrate.py"]
    environment:
      DATABASE_URL: postgresql://sadwave@postgres:5432/sadwave
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DATABASE_USER: sadwave_app
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
